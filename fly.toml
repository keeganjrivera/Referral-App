app = 'personalized-pool-referrals-v2'
primary_region = 'iad'

[build]

[deploy]
  release_command = 'npx prisma db push --skip-generate --accept-data-loss'

[env]
  PORT = '3000'
  SHOPIFY_APP_URL = 'https://personalized-pool-referrals-v2.fly.dev'
  SCOPES = 'read_customers,read_orders,write_customers,write_discounts,write_orders,write_products'
  SHOPIFY_API_KEY = '2c7bfb17648cb59802f1c553cb6ad492'


[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
