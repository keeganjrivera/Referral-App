name = "Referrals"
client_id = "80f257f5437beca1efaa1077b2b4f48a"
application_url = "https://prototype-deeper-finance-roses.trycloudflare.com"
embedded = true

[build]
dev_store_url = "https://personalized-pool-dev-store.myshopify.com"

[access_scopes]
scopes = "write_products,read_customers,write_customers,read_orders,write_orders,write_discounts"

[auth]
redirect_urls = [
  "https://prototype-deeper-finance-roses.trycloudflare.com/auth/callback",
  "https://prototype-deeper-finance-roses.trycloudflare.com/auth/shopify/callback",
  "https://prototype-deeper-finance-roses.trycloudflare.com/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

[[webhooks.subscriptions]]
topics = [ "customers/create" ]
uri = "/webhooks/customers/create"

[[webhooks.subscriptions]]
topics = [ "orders/create" ]
uri = "/webhooks/orders/create"

[pos]
embedded = false